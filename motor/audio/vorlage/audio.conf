# Hörbuch – Einstellungen (pureSATZ, nur Linux, Testphase). Hilfe: «Hörbuch».
ALBUM=""                # leer = {titel} des Buchs
ARTIST=""               # leer = {autor}
COVER=""                # leer = Umschlag vorne (ausgabe-normal/…_Vorderseite.jpg), sonst Pfad zu einem Bild
AUSSPRACHE="aussprache.txt"   # gilt nur, wenn es keine aussprache-<stimme>.txt gibt

# Stimme: 1 = Favorit 1, 2 = Favorit 2, oder ganzer Stimmname (z. B. de-DE-ConradNeural)
# Einmalig anders: python3 motor/audio/hoerbuch.py alles stimme=2
AZURE_FAVORIT1="en-GB-OllieMultilingualNeural"
AZURE_FAVORIT2="de-DE-FlorianMultilingualNeural"
AZURE_STIMME="1"
AZURE_SPRACHE="de-DE"   # fest Deutsch – sonst kippt Ollie bei englischen Wörtern ins Englische
AZURE_RATE="-8%"        # minus = langsamer
AZURE_SATZPAUSE="800"   # ms nach 15-Wort-Satz (600–1500), 0 = aus
AZURE_PAUSE="1200ms"    # zwischen Absätzen
AZURE_TITELPAUSE="2000ms"  # vor und nach dem Kapitelnamen
AZURE_ANSAGE="{titel}. {untertitel}. Von {autor}. Gelesen von Ollie, einer KI-Stimme von Microsoft Azure."
MP3_KBIT="128"          # 128 = Test · 192 (oder mehr) = Produktion: 44,1 kHz, Lautstärke angeglichen, eigener Ordner
